<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores 3: pseudoclases y pseudoelementos</title>
    <style>
        p::first-letter{
            color: teal;
        }
        p::before{
            content:"🧏‍♀️" ;
        }
        p::after {
            content: "🖐-";
        }
        p {
            color: darksalmon;
        }
        p:hover {
            color: skyblue;
        }
        div p:nth-child(2){
          color: violet;  
        }
        ::placeholder {
            color: tomato;
        }
    </style>
</head>
<body>
    <p>Hola</p>
    <div>
        <p>Platzi</p>
        <p>Master</p>
        <p>Lo mejor</p>
    </div>
    <input type="text" placeholder="none">
</body>
</html>
